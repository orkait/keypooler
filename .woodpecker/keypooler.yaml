when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  gates:
    image: golang:1.25-bookworm
    environment:
      KEYPOOLER_TEST_DATABASE_URL: postgres://postgres:test@database:5432/keypooler
    commands:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -race -count=1 -v ./... > test.log || (cat test.log; exit 1)
      - grep -E '^(ok|FAIL|---)' test.log
      - "! grep -q -- '--- SKIP' test.log"

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: keypooler
