services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keypooler
      POSTGRES_PASSWORD: keypooler
      POSTGRES_DB: keypooler
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pool-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keypooler"]
      interval: 2s
      retries: 15

  keypooler:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://keypooler:keypooler@postgres:5432/keypooler
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pool-data:
